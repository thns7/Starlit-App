name: Deploy Web

# Publica a versão web do app no GitHub Pages a cada mudança na main.
# No iPhone: abra o link no Safari → Compartilhar → Adicionar à Tela de Início.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # O token do TMDB está salvo como secret do ambiente "TMDB_TOKEN".
    environment: TMDB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN || vars.TMDB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "$TMDB_TOKEN" ]; then ARGS="--dart-define=TMDB_TOKEN=$TMDB_TOKEN"; else echo "::warning::TMDB_TOKEN não configurado: site sem filmes do TMDB"; fi
          flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/" $ARGS
          # Id da versão: força o navegador a baixar o app novo a cada publicação.
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::10}/" build/web/index.html
          grep -q "${GITHUB_SHA::10}" build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
