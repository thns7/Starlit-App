<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    O href abaixo é substituído pelo valor de `--base-href` no `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Starlit: compartilhe suas opiniões sobre filmes e descubra novos filmes para amar.">
  <meta name="theme-color" content="#301870">
  <meta http-equiv="Cache-Control" content="no-cache">

  <!-- iOS: abre em tela cheia quando adicionado à Tela de Início -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Starlit">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Starlit</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #301870; }
  </style>
</head>
<body>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
